<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex,nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="コトダマンの降臨キャラ獲得状況・祝福とくせいの習得状況の管理データベース。">
  <meta name="theme-color" content="#0f172a">
  <title>KOTODAMAN DB</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text: #e2e8f0;
      --text-dim: #94a3b8;
      --accent: #38bdf8;
      --ok: #4ade80;
      --ng: #64748b;
      --warn: #facc15;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 16px;
      background: var(--bg-color); color: var(--text);
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      -webkit-text-size-adjust: 100%;
    }
    header { max-width: 960px; margin: 0 auto 16px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    h1 .sub { color: var(--accent); }
    .summary { color: var(--text-dim); font-size: 13px; }
    .controls {
      max-width: 960px; margin: 0 auto 16px;
      display: flex; flex-wrap: wrap; gap: 8px;
    }
    .controls input[type="search"] {
      flex: 1 1 200px; padding: 10px 12px; border-radius: 8px;
      border: 1px solid var(--card-border); background: var(--card-bg);
      color: var(--text); font-size: 15px;
    }
    .controls select {
      padding: 10px; border-radius: 8px;
      border: 1px solid var(--card-border); background: var(--card-bg);
      color: var(--text); font-size: 14px;
    }
    .controls button {
      padding: 10px 14px; border-radius: 8px; cursor: pointer;
      border: 1px solid var(--card-border); background: var(--card-bg);
      color: var(--text); font-size: 14px;
    }
    .controls button:hover { border-color: var(--accent); }
    main { max-width: 960px; margin: 0 auto; display: grid; gap: 12px; }
    .card {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 12px; padding: 14px 16px;
    }
    .card-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .card-name { font-size: 18px; font-weight: bold; }
    .badge {
      font-size: 12px; padding: 2px 10px; border-radius: 999px; font-weight: bold;
    }
    .badge.acquired { background: #14532d; color: var(--ok); }
    .badge.not-acquired { background: #334155; color: var(--text-dim); }
    .badge.full { background: #14532d; color: var(--ok); }
    .badge.partial { background: #713f12; color: var(--warn); }
    .badge.none { background: #334155; color: var(--text-dim); }
    button.badge { border: none; cursor: pointer; font-family: inherit; }
    button.badge:hover { outline: 1px solid var(--accent); }
    .meta { color: var(--text-dim); font-size: 13px; margin-top: 2px; }
    .traits { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; align-items: center; }
    .traits-label { font-size: 12px; color: var(--accent); margin-right: 2px; }
    .trait {
      font-size: 13px; padding: 4px 10px; border-radius: 8px;
      border: 1px solid var(--card-border);
      background: transparent; color: var(--ng);
      cursor: pointer; font-family: inherit;
    }
    .trait:hover { border-color: var(--accent); }
    .trait.unlocked { color: var(--ok); border-color: #14532d; background: #052e16; }
    .trait .ex-tag {
      font-size: 10px; font-weight: bold; color: var(--warn);
      border: 1px solid var(--warn); border-radius: 4px;
      padding: 0 3px; margin-right: 4px;
    }
    .trait .type-tag {
      font-size: 10px; font-weight: bold; color: #0f172a;
      border-radius: 4px; padding: 1px 4px; margin-right: 4px;
    }
    .trait .trait-icon {
      width: 18px; height: 18px; vertical-align: -4px;
      margin-right: 4px; border-radius: 3px;
    }
    .legend { max-width: 960px; margin: 0 auto 12px; font-size: 12px; color: var(--text-dim); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .legend .type-tag {
      font-size: 10px; font-weight: bold; color: #0f172a;
      border-radius: 4px; padding: 1px 4px;
    }
    .notes { color: var(--text-dim); font-size: 13px; margin-top: 8px; white-space: pre-wrap; }
    .abilities { margin-top: 10px; font-size: 13px; display: grid; gap: 3px; }
    .abilities .ab-label { color: var(--accent); font-size: 12px; margin-right: 8px; }
    .empty { color: var(--text-dim); text-align: center; padding: 32px 0; }
    footer { max-width: 960px; margin: 24px auto 0; color: var(--text-dim); font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <h1>KOTODAMAN <span class="sub">DB</span></h1>
    <div class="summary" id="summary">読み込み中…</div>
  </header>

  <div class="controls">
    <input type="search" id="q" placeholder="キャラ名・祝福とくせい名で検索">
    <select id="f-acquired">
      <option value="all">獲得状況：すべて</option>
      <option value="acquired">獲得済み</option>
      <option value="not">未獲得</option>
    </select>
    <select id="f-traits">
      <option value="all">祝福とくせい：すべて</option>
      <option value="full">全習得</option>
      <option value="partial">一部習得</option>
      <option value="none">未習得</option>
    </select>
    <select id="f-source">
      <option value="all">出典：すべて</option>
    </select>
    <button id="btn-export" type="button">状態をJSONで書き出す</button>
    <button id="btn-reset" type="button">状態をリセット</button>
  </div>

  <div class="legend" id="legend"></div>

  <main id="list"></main>

  <footer>個人用の管理DBです。バッジと祝福とくせいのチップはクリックで切り替えでき、状態はこのブラウザに保存されます。正本への反映は「状態をJSONで書き出す」からダウンロードしたファイルをみみに渡してください。</footer>

  <script>
    let DATA = [];
    const LS_KEY = "kotodaman-db-state-v1";

    function loadState() {
      try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; }
      catch (e) { return {}; }
    }
    function saveState() {
      const st = { acquired: {}, traits: {} };
      DATA.forEach(c => {
        st.acquired[c.id] = !!c.acquired;
        st.traits[c.id] = (c.traits || []).map(t => !!t.unlocked);
      });
      localStorage.setItem(LS_KEY, JSON.stringify(st));
    }
    function applyState() {
      const st = loadState();
      DATA.forEach(c => {
        if (st.acquired && c.id in st.acquired) c.acquired = st.acquired[c.id];
        const arr = st.traits && st.traits[c.id];
        if (Array.isArray(arr)) {
          (c.traits || []).forEach((t, i) => { if (i < arr.length) t.unlocked = arr[i]; });
        }
      });
    }

    function traitIcon(name) {
      if (name.includes("レーザーガード")) return "icons/laser_guard.png";
      if (name.includes("ビリビリガード")) return "icons/biribiri_guard.png";
      if (name.includes("弱体ガード")) return "icons/jakutai_guard.png";
      if (name.includes("HP基礎値")) return "icons/hp_base.png";
      if (name.includes("ATK基礎値")) return "icons/atk_base.png";
      if (name.includes("文字変換")) return "icons/moji.png";
      if (name.includes("バリア貫通")) return "icons/barrier.png";
      if (name.includes("弱点ダメージ")) return "icons/jakuten.png";
      if (name.includes("ドロー時")) return "icons/draw_heal.png";
      if (name.includes("コンボ")) return "icons/combo.png";
      return null;
    }

    function traitType(name) {
      if (name.includes("バリア貫通")) return ["貫通", "#7dd3fc"];
      if (name.includes("文字変換")) return ["文字", "#f9a8d4"];
      if (name.includes("ガード")) return ["ガード", "#86efac"];
      if (name.includes("基礎値")) return ["基礎値", "#fcd34d"];
      if (name.includes("弱点ダメージ")) return ["弱点", "#fca5a5"];
      if (name.includes("発動条件")) return ["条件", "#c4b5fd"];
      if (name.includes("回復")) return ["回復", "#5eead4"];
      if (name.includes("ブレイカー")) return ["ブレイカー", "#fdba74"];
      return ["その他", "#cbd5e1"];
    }

    function traitState(c) {
      if (!c.traits || c.traits.length === 0) return "none";
      const u = c.traits.filter(t => t.unlocked).length;
      if (u === 0) return "none";
      if (u === c.traits.length) return "full";
      return "partial";
    }

    function render() {
      const q = document.getElementById("q").value.trim();
      const fa = document.getElementById("f-acquired").value;
      const ft = document.getElementById("f-traits").value;
      const fs = document.getElementById("f-source").value;

      const rows = DATA.filter(c => {
        if (fa === "acquired" && !c.acquired) return false;
        if (fa === "not" && c.acquired) return false;
        if (ft !== "all" && traitState(c) !== ft) return false;
        if (fs !== "all" && c.source !== fs) return false;
        if (q) {
          const ab = c.abilities || {};
          const flat = v => Array.isArray(v) ? v.join(" ") : (v || "");
          const hay = c.name + " " + (c.source || "") + " " +
            (c.traits || []).map(t => t.name).join(" ") + " " +
            [flat(ab.leader), flat(ab.trait1), flat(ab.trait2),
             flat(ab.waza), flat(ab.sugowaza), flat(ab.kotowaza)].join(" ");
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      const total = DATA.length;
      const acq = DATA.filter(c => c.acquired).length;
      const full = DATA.filter(c => traitState(c) === "full").length;
      document.getElementById("summary").textContent =
        `全${total}件 / 獲得済み ${acq}件 / 祝福とくせい全習得 ${full}件（表示 ${rows.length}件）`;

      const list = document.getElementById("list");
      if (rows.length === 0) {
        list.innerHTML = '<div class="empty">該当するキャラがいません</div>';
        return;
      }
      list.innerHTML = rows.map(c => {
        const st = traitState(c);
        const u = (c.traits || []).filter(t => t.unlocked).length;
        const stBadge = (c.traits && c.traits.length)
          ? (st === "full"
            ? `<span class="badge full">祝福とくせい 全習得</span>`
            : st === "partial"
              ? `<span class="badge partial">祝福とくせい ${u}/${c.traits.length} 習得</span>`
              : `<span class="badge none">祝福とくせい 未習得</span>`)
          : `<span class="badge none">祝福とくせい なし</span>`;
        const traits = (c.traits || []).map((t, i) => {
          const [tt, tc] = traitType(t.name);
          const icon = traitIcon(t.name);
          const head = icon
            ? `<img class="trait-icon" src="${icon}" alt="${tt}">`
            : `<span class="type-tag" style="background:${tc}">${tt}</span>`;
          return `<button type="button" class="trait ${t.unlocked ? "unlocked" : "locked"}" data-act="trait" data-id="${escapeHtml(c.id)}" data-idx="${i}">${head}${t.ex ? '<span class="ex-tag">EX</span>' : ""}${t.unlocked ? "✓ " : ""}${escapeHtml(t.name)}</button>`;
        }).join("");
        const ab = c.abilities || {};
        const flat = v => Array.isArray(v) ? v.join(" ／ ") : (v || "");
        const abRows = [];
        if (ab.leader) abRows.push(`<div><span class="ab-label">リーダーとくせい</span>${escapeHtml(flat(ab.leader))}</div>`);
        if (flat(ab.trait1) || flat(ab.trait2)) abRows.push(`<div><span class="ab-label">とくせい</span>${[flat(ab.trait1), flat(ab.trait2)].filter(Boolean).map(escapeHtml).join(" ／ ")}</div>`);
        if (ab.waza) abRows.push(`<div><span class="ab-label">わざ</span>${escapeHtml(flat(ab.waza))}</div>`);
        if (ab.sugowaza) abRows.push(`<div><span class="ab-label">すごわざ</span>${escapeHtml(flat(ab.sugowaza))}</div>`);
        if (ab.kotowaza) abRows.push(`<div><span class="ab-label">コトわざ</span>${escapeHtml(flat(ab.kotowaza))}</div>`);
        const abilities = abRows.length ? `<div class="abilities">${abRows.join("")}</div>` : "";
        return `<article class="card">
          <div class="card-head">
            <span class="card-name">${escapeHtml(c.name)}</span>
            <button type="button" class="badge ${c.acquired ? "acquired" : "not-acquired"}" data-act="acquired" data-id="${escapeHtml(c.id)}">${c.acquired ? "獲得済み" : "未獲得"}</button>
            ${stBadge}
          </div>
          <div class="meta">${escapeHtml(c.source || "")}${c.releaseDate ? " / " + escapeHtml(c.releaseDate) : ""}</div>
          ${abilities}
          ${traits ? `<div class="traits"><span class="traits-label">祝福とくせい</span>${traits}</div>` : ""}
          ${c.notes ? `<div class="notes">${escapeHtml(c.notes)}</div>` : ""}
        </article>`;
      }).join("");
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, ch =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
    }

    document.getElementById("list").addEventListener("click", e => {
      const btn = e.target.closest("[data-act]");
      if (!btn) return;
      const c = DATA.find(x => x.id === btn.dataset.id);
      if (!c) return;
      if (btn.dataset.act === "acquired") {
        c.acquired = !c.acquired;
      } else if (btn.dataset.act === "trait") {
        const t = (c.traits || [])[Number(btn.dataset.idx)];
        if (t) t.unlocked = !t.unlocked;
      }
      saveState();
      render();
    });

    document.getElementById("btn-export").addEventListener("click", () => {
      const blob = new Blob([JSON.stringify(DATA, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "data.json";
      a.click();
      URL.revokeObjectURL(a.href);
    });
    document.getElementById("btn-reset").addEventListener("click", () => {
      if (!confirm("このブラウザに保存した状態を消して、data.jsonの初期状態に戻しますか？")) return;
      localStorage.removeItem(LS_KEY);
      fetch("data.json").then(r => r.json()).then(data => { DATA = data; render(); });
    });

    fetch("data.json")
      .then(r => r.json())
      .then(data => {
        DATA = data;
        applyState();
        const sources = [...new Set(DATA.map(c => c.source).filter(Boolean))];
        const sel = document.getElementById("f-source");
        sources.forEach(s => {
          const o = document.createElement("option");
          o.value = s; o.textContent = s;
          sel.appendChild(o);
        });
        render();
        const cats = [["貫通", "#7dd3fc"], ["文字", "#f9a8d4"], ["ガード", "#86efac"],
          ["基礎値", "#fcd34d"], ["弱点", "#fca5a5"], ["条件", "#c4b5fd"],
          ["回復", "#5eead4"], ["ブレイカー", "#fdba74"], ["その他", "#cbd5e1"]];
        document.getElementById("legend").innerHTML =
          "祝福とくせいの種類：" + cats.map(([n, col]) =>
            `<span class="type-tag" style="background:${col}">${n}</span>`).join("");
      })
      .catch(() => {
        document.getElementById("summary").textContent = "data.json の読み込みに失敗しました";
      });

    ["q", "f-acquired", "f-traits", "f-source"].forEach(id => {
      document.getElementById(id).addEventListener("input", render);
      document.getElementById(id).addEventListener("change", render);
    });
  </script>
</body>
</html>
